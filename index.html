<!DOCTYPE html>
<html>
<head>
  <title>AR Dress Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body style="margin:0;background:#f5f5f5;font-family:Arial;text-align:center">

<h2>AR Dress Demo</h2>

<model-viewer
src="dress.glb"
ar
ar-modes="scene-viewer webxr quick-look"
camera-controls
auto-rotate
style="width:100%;height:500px;">
</model-viewer>

<p>Tap the AR button to view the dress in your room.</p>

</body>
</html>
