 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Dress Demo</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:#f5f5f5;
}

model-viewer{
  width:100%;
  height:100vh;
}
</style>

</head>
<body>

<model-viewer
  src="men_regular_apparel_fit_sporty_t-shirt.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>
</model-viewer>

</body>
</html>
